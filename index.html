<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ren — profile</title>
  <style>
    /* Page Background & Font */
    body {
      margin: 0;
      padding: 40px 15px;
      background-color: #f3f0f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #5a5566;
      display: flex;
      justify-content: center;
    }

    /* Main White Card with Soft Lavender Glow */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 35px rgba(154, 134, 194, 0.25);
      box-sizing: border-box;
    }

    /* Top Banner Area */
    .banner {
      position: relative;
      width: 100%;
      height: 150px;
      border-radius: 14px;
      background: linear-gradient(120deg, #dcd2f0, #f5f2fa);
      overflow: hidden;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 30px;
      box-sizing: border-box;
    }

    .banner img {
      position: absolute;
      left: 0;
      top: 0;
      width: 65%;
      height: 100%;
      object-fit: cover;
      mask-image: linear-gradient(to right, black 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black 60%, transparent 100%);
    }

    .banner-text {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .badge {
      background: rgba(154, 134, 194, 0.2);
      color: #7d68a8;
      padding: 5px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .quote {
      font-size: 14px;
      color: #6b6378;
      margin: 0;
    }

    /* Two-Column Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    /* Mobile Responsive Fix */
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Typography & Dividers */
    h1.username {
      text-align: center;
      font-size: 32px;
      margin: 5px 0 10px 0;
      color: #8f7ab8;
      letter-spacing: 1px;
    }

    h1.username span {
      color: #cbbbe6;
      font-weight: normal;
    }

    .bio {
      text-align: center;
      font-size: 14px;
      color: #6b6378;
      margin: 0 0 18px 0;
    }

    p {
      font-size: 13.5px;
      line-height: 1.6;
      margin: 0 0 18px 0;
    }

    strong {
      color: #4a4458;
    }

    hr.dashed {
      border: none;
      border-top: 2px dashed #dcd4eb;
      margin: 20px 0;
    }

    /* Image & Video Boxes */
    .media-box {
      width: 100%;
      height: 155px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 18px;
      background-color: #e6dff2;
      position: relative;
    }

    .media-box img,
    .media-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bottom Social Links */
    .socials {
      text-align: right;
      margin-top: 10px;
      font-size: 13px;
    }

    .socials a {
      color: #8f7ab8;
      text-decoration: none;
      margin-left: 10px;
      font-weight: bold;
    }

    .socials a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Top Banner -->
    <div class="banner">
      <!-- Replace banner.jpg with your uploaded banner filename -->
      <img src="banner.jpg" alt="">
      <div class="banner-text">
        <div class="badge">REN</div>
        <p class="quote">""</p>
      </div>
    </div>

    <!-- Main Two-Column Content -->
    <div class="grid">
      
      <!-- Left Column -->
      <div>
        <h1 class="username"><span>"</span> ren <span>,,</span></h1>
        <p class="bio">20 he/him</p>
        
        <hr class="dashed">
        
        <div class="media-box">
          <!-- Replace left-pic.gif with your uploaded image/GIF filename -->
          <img src="left-pic.gif" alt="">
        </div>
        
        <p><strong>DNI</strong> “lolicons” “shotacons” also known as pedophiles. under 17. other than that i have no dni just don’t be weird and as long as my mutuals isn’t a bigot idc if they’re “problematic”</p>
      </div>

      <!-- Right Column -->
      <div>
        <div class="media-box">
          <!-- Replace right-pic.gif with your uploaded image/GIF filename -->
          <img src="right-pic.gif" alt="">
        </div>
        
        <!-- Video Box -->
        <div class="media-box">
          <!-- Replace video.mp4 with your uploaded video filename -->
          <video src="video.mp4" controls loop playsinline></video>
        </div>

        <!-- Social Links (Leave # for now or paste your profile URLs later) -->

          <a href="#" target="_blank">TikTok</a>
          <a href="#" target="_blank">Spotify</a>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
